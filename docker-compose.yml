version: '3.8'

services:
  # FastAPI Application
  api:
    build: .
    container_name: servicedesk_bot_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/servicedesk_db
      - WHATSAPP_VERIFY_TOKEN=SERVICE_DESK_WEBHOOK_VERIFY_TOKEN_2026
      - WHATSAPP_API_TOKEN=EAAG...MOCK_TOKEN
      - WHATSAPP_PHONE_NUMBER_ID=10987654321
      - DEBUG=True
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: servicedesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: servicedesk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servicedesk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
